[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-analytics"
version = "0.1.0"
description = "Formula 1 race analytics: session ingestion, lap/pace analysis, tyre strategy, telemetry and qualifying analysis, built on FastF1."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alberto Montenegro" }]
keywords = ["formula1", "f1", "motorsport", "fastf1", "data-analysis", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "fastf1>=3.3",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "plotly>=5.20",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/AMonten/f1-race-analytics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
