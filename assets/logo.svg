<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="f1-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E00" />
      <stop offset="100%" stop-color="#B30000" />
    </linearGradient>

    <linearGradient id="telemetry-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>

    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Sombras y destellos -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo contenedor (Opcional, removible para fondo transparente) -->
  <rect width="800" height="240" rx="16" fill="url(#dark-bg)" />

  <!-- ISOLOGOTIPO (GRUPO DE ICONO DE TELEMETRÍA + F1) -->
  <g transform="translate(45, 40)">
    <!-- Grilla de Telemetría / Coordenadas de Fondo -->
    <g opacity="0.15" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4,4">
      <line x1="20" y1="20" x2="160" y2="20" />
      <line x1="20" y1="60" x2="160" y2="60" />
      <line x1="20" y1="100" x2="160" y2="100" />
      <line x1="20" y1="140" x2="160" y2="140" />
      <line x1="20" y1="20" x2="20" y2="140" />
      <line x1="90" y1="20" x2="90" y2="140" />
      <line x1="160" y1="20" x2="160" y2="140" />
    </g>

    <!-- Barras de Datos / Histograma de Degradación -->
    <g opacity="0.3" fill="url(#telemetry-blue)">
      <rect x="35" y="90" width="8" height="50" rx="2" />
      <rect x="50" y="70" width="8" height="70" rx="2" />
      <rect x="65" y="105" width="8" height="35" rx="2" />
      <rect x="80" y="55" width="8" height="85" rx="2" />
      <rect x="95" y="80" width="8" height="60" rx="2" />
      <rect x="110" y="40" width="8" height="100" rx="2" />
      <rect x="125" y="65" width="8" height="75" rx="2" />
      <rect x="140" y="95" width="8" height="45" rx="2" />
    </g>

    <!-- Estructura Dinámica de la 'F' + Curva de Telemetría (Roja) -->
    <path d="M 25,30 L 155,30 L 135,55 L 60,55 L 50,85 L 125,85 L 110,110 L 40,110 L 25,160 L 0,160 Z" fill="url(#f1-red)" />
    
    <!-- Trazo de la '1' / Onda de Velocidad Sync -->
    <path d="M 135,30 L 175,30 L 130,160 L 95,160 Z" fill="url(#f1-red)" opacity="0.85" />

    <!-- Traza de Telemetría (Línea Cian Superpuesta) -->
    <path d="M 15,135 Q 45,110 70,125 T 120,60 T 175,35" fill="none" stroke="url(#telemetry-blue)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
    
    <!-- Puntos de Datos / Scatter Points en la curva -->
    <circle cx="70" cy="125" r="4.5" fill="#00F0FF" />
    <circle cx="120" cy="60" r="4.5" fill="#00F0FF" />
    <circle cx="175" cy="35" r="5.5" fill="#FFFFFF" filter="url(#glow)" />
  </g>

  <!-- TEXTO DEL LOGO -->
  <g transform="translate(240, 0)">
    <!-- Título Principal: F1 RACE -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="54" font-style="italic" letter-spacing="1" fill="#FFFFFF">
      F1 RACE
    </text>

    <!-- Subtítulo / Identificador: ANALYTICS -->
    <text x="3" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="9" fill="url(#telemetry-blue)">
      ANALYTICS
    </text>

    <!-- Tagline técnico secundario -->
    <text x="5" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="400" font-size="11" letter-spacing="1.5" fill="#8B949E">
      DATA INGESTION &amp; TELEMETRY ENGINE
    </text>
  </g>
</svg>
